<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
    <title>Job Application Tracker</title>
  </head>
  <body>
    <!-- header -->
    <header class=" w-full flex justify-between bg-amber-50 px-3 py-8 border-b border-gray-500">
      <div class=" flex gap-2 items-center">
        <div class="logo-icon bg-linear-155 from-pink-400/40 to-orange-400/50 p-2 max-w-fit rounded-xl">
          <i data-lucide="sparkles" class="text-2xl"></i>
        </div>
        <div>
          <h2 class="font-extrabold text-gray-800">Job Tracker</h2>
        </div>
      </div>
      <button id="newApp" class="newApp flex items-center bg-linear-155 from-pink-400/40 to-orange-400/50">
        <i data-lucide="plus"></i>
        New Job Application
      </button>
    </header>

    <!-- Modal or pop-up form -->
    <div id="jobModal" class="jobModal">
      <div class="modal-content">
        <h2>Add Job Application</h2>
        <!-- the form itself -->
        <form action="" id="application-form" class="flex flex-col gap-2">
          <label for="">
            Company name*:
            <input
              type="text"
              placeholder="Enter company name..."
              id="company-name"
              required
            />
          </label>

          <label for="">
            Job title*:
            <input
              type="text"
              id="job-title"
              placeholder="Enter job title..."
              required
            />
          </label>

          <label for="">
            Application date:
            <input type="date" name="" id="application-date" />
          </label>

          <label for="">
            Status:
            <select name="status" id="status-select">
              <option value="select">Select</option>
              <option value="applied">Applied</option>
              <option value="interview">Interview</option>
              <option value="rejected">Rejected</option>
              <option value="offer">Offer</option>
            </select>
          </label>

          <label for="">
            Notes:
            <textarea
              name=""
              id="application-notes"
              placeholder="additional comment(s)"
            >
            </textarea>
          </label>

          <button type="submit" id="submit-btn" class="border max-w-fit px-2">
            Save
          </button>
        </form>
        <button class="closeBtn border max-w-fit px-2" id="closeBtn">
          Close
        </button>
      </div>
    </div>

    <!-- input for filter -->
    <div class="search-filter-container flex py-5">
      <input
        id="search-filter"
        class="search-filter"
        type="text"
        placeholder="search to filter application by company...."
      />
    </div>


    <!-- for job applications -->
    <div id="applications-container" class="jobApp-container"></div>

      <!-- link to js-code -->
    <script src="./src/script.js"></script>

    <!-- lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
