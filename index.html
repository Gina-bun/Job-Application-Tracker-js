<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
    <title>Job Application Tracker</title>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <!-- header -->
    <header class="sticky top-0 w-full flex justify-between bg-[#fffdfc] px-3 py-8 border-b border-gray-500">
      <div class=" flex gap-2 items-center">
        <div class="logo-icon bg-linear-155 from-pink-400/40 to-orange-400/50 p-2 max-w-fit rounded-xl">
          <i data-lucide="sparkles" class="text-2xl"></i>
        </div>
        <div>
          <h2 class="font-extrabold text-gray-800">Job Tracker</h2>
        </div>
      </div>
      <button id="newApp" class="newApp border-none flex items-center bg-linear-155 from-pink-400/40 to-orange-400/50">
        <i data-lucide="plus"></i>
        New Job Application
      </button>
    </header>

    <!-- Modal or pop-up form -->
    <div id="jobModal" class="jobModal">
      <div class="modal-content">
        <div class="flex gap-3">
          <i data-lucide="sparkles" class="text-[#eb5c70]"></i>
            <h2 class="font-bold ">Add Job Application</h2>
        </div>
      
        <!-- the form itself -->
        <form action="" id="application-form" class="flex flex-col gap-2">
          <label class="mt-3" for="">
            Company Name*
            <input
              type="text"
              placeholder="Enter company name..."
              id="company-name"
              required
            />
          </label>

          <label for="">
            Role / Position*
            <input
              type="text"
              id="job-title"
              placeholder="Enter job title..."
              required
            />
          </label>

          <label for="">
            Application Date
            <input type="date" name="" id="application-date" />
          </label>

          <label for="">
            Status:
            <select name="status" id="status-select" class="block w-full">
              <option value="select">Select status</option>
              <option value="applied">Applied</option>
              <option value="interview">Interview</option>
              <option value="rejected">Rejected</option>
              <option value="offer">Offer</option>
            </select>
          </label>

          <button type="submit" id="submit-btn" class="submitJobBtn bg-linear-155 from-pink-400/40 to-orange-400/50 border max-w-fit px-2">
            Save Application
          </button>
        </form>
        <button class="closeBtn border max-w-fit px-2" id="closeBtn">
          Close 
        </button>
      </div>
    </div>

    <!-- input for filter -->
    <div class="search-filter-containe rounded-md bg-white flex my-5 mx-[1em] ">
      <i data-lucide="menu"></i>
      <input
        id="search-filter"
        class="search-filter "
        type="text"
        placeholder="search to filter application by company...."
      />
    </div>

    <!-- display to show total number of jobs -->
     <p id="number-of-jobs" class="pl-[1em]"></p>


    <!-- for job applications -->
    <div id="applications-container" class="jobApp-container"></div>

      <!-- link to js-code -->
    <script src="./src/script.js"></script>

    <!-- lucide icons -->
    
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
